services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/student_feedback_analyzer.db
      SEED_DATA_PATH: /app/data/seed_feedback.csv
      MODEL_PATH: /app/artifacts/sentiment_model.joblib
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./data:/app/data
      - sfa-artifacts:/app/artifacts
      - sfa-db:/app/db
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
volumes:
  sfa-artifacts:
  sfa-db:
